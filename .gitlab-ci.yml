image: jgilligan/jg-verse:latest

variables:
  PKGNAME: "revealjmg"
  R_LIBS_USER: "$CI_PROJECT_DIR/ci/lib"
  CRAN_REPOS: "https://cran.rstudio.com/"

cache:
  key: lib
  paths:
  - $R_LIBS_USER

stages:
  - test
  - document

before_script:
  - mkdir -p $R_LIBS_USER
  - R -e 'pak::local_install_deps(dependencies = TRUE)'

test:
  stage: test
  script:
    # - R -e "install.packages(c('janitor', 'R.utils'))"
    - pwd
    - ls -lah .
    - R -e "sessionInfo()"
    - R CMD build . --no-manual
    - PKG_FILE_NAME=$(ls -1t *.tar.gz | head -n 1)
    - R CMD check "${PKG_FILE_NAME}" --no-manual
  artifacts:
    paths:
      - revealjmg.Rcheck/00*.log
      - revealjmg.Rcheck/00*.out
    expire_in: 24 hours
    when: on_failure

pages:
  stage: document
  dependencies:
    - test
  script:
    - Rscript -e 'pkgdown::build_site(preview = FALSE, new_process = TRUE, devel = FALSE, install = TRUE, override = list(destination = "public"))'
  artifacts:
    paths:
      - public
    expire_in: 30 days
  only:
    - main
